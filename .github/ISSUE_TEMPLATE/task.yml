name: Task
description: A new piece of work on one component (bugs found by tests too)
title: "[COMP-N] Short title"
body:
  - type: input
    id: component
    attributes:
      label: Component
      description: CONN, HTTP, POOL, APP, WAL, SNAP, VEC, KW, CLI or LOAD
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is this, in plain words?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      value: |
        - [ ]
    validations:
      required: true
